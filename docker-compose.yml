services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: pet
      POSTGRES_DB: pet_dance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet -d pet_dance"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://pet:pet@postgres:5432/pet_dance
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: arq
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_PUBLIC_BASE: http://localhost:8080
      SMS_PROVIDER: dev
      SMS_DEV_CODE: "246810"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: petdance-admin
    volumes:
      - storage:/data/storage
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build: .
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://pet:pet@postgres:5432/pet_dance
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: arq
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_PUBLIC_BASE: http://localhost:8080
      SMS_PROVIDER: dev
    volumes:
      - storage:/data/storage
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.wait_ready http://api:8000/health/ready && arq app.worker_settings.WorkerSettings"]

volumes:
  storage:
