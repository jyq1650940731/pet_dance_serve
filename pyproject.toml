[project]
name = "pet-dance-server"
version = "0.4.0"
description = "pet_dance 第 1–4 周服务端：账号、模板、任务、点数与员工后台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "pillow>=11",
    "httpx>=0.28",
    "oss2>=2.19",
    "fakeredis>=2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
